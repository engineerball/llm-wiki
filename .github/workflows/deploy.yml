name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Resolve wiki/assets symlink — symlinks don't survive git clone reliably
      - name: Resolve assets symlink
        run: |
          rm wiki/assets
          cp -r raw/assets wiki/assets

      - name: Install dependencies
        run: npm ci
        working-directory: quartz

      - name: Build
        run: npx quartz build -d ../wiki
        working-directory: quartz

      - uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4